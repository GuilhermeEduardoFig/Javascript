<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background-color: yellow;
        }

        h1{
            color: black;
        }
    </style>
</head>
<body>
    <h1>JavaScript</h1>
    <script>
        // pode ser usado somente parseInt ou parseFloat sem precisar do "Number.parseInt"
        // mas pode ser usado somente o "Number" para que o propio js escolha como converter
        var n1 = Number(window.prompt('Digite um número:')) //string
        var n2 = Number(window.prompt('Digite outro número:')) //string
        var s = n1 + n2
        window.alert(`A soma entre ${n1} + ${n2} é ${s}`)
        //e pode ser usado pra converter pra string o n.toString() ou String(n) o String(n) sendo o comando mais recente
    </script>
</body>
</html>
