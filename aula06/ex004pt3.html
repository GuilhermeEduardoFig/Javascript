<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background-color: yellow;
        }

        h1{
            color: black;
        }
    </style>
</head>
<body>
    <h1>JavaScript</h1>
    <script>
        var nome = window.prompt('Qual seu nome?')
        document.write(`Olá ${nome} seu nome tem ${nome.length} letras </br>`)
        document.write(`Olá ${nome} seu nome em maiusculo fica ${nome.toUpperCase()} </br>`)
        document.write(`Olá ${nome} seu nome em minusculo fica ${nome.toLowerCase()}`)
        // use os comandos da linha 25 pra mostras a quantidade de letras "s.length", o da linha 26 em maiusculas "s.toUpperCase()" e o da linha 27 em minusculas "s.toLowerCase()"
        
    </script>
</body>
</html>
